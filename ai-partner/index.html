    :root {
      color-scheme: light;
      --bg: #f3efe8;
      --ink: #191919;
      --accent: #111111;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    .viewer { flex: 1; min-height: 100vh; position: relative; background: var(--bg); }
    iframe { width: 100%; height: 100vh; border: 0; display: block; background: var(--bg); }
    .cta {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 20;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .01em;
      box-shadow: 0 12px 35px rgba(0,0,0,.24);
    }
    .cta:hover { transform: translateY(-1px); }
    .cta:focus-visible { outline: 3px solid #6f79ff; outline-offset: 4px; }
    .fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      text-align: center;
      background: var(--bg);
      z-index: 0;
    }
    .fallback a { color: inherit; font-weight: 700; }
    @media (max-width: 700px) {
      .cta { left: 16px; right: 16px; bottom: max(14px, env(safe-area-inset-bottom)); }
    }
